<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI Ассистент</title>
<!-- Подключаем Telegram WebApp -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<!-- Подключаем бесплатный ИИ -->
<script src="https://js.puter.com/v2/"></script>

<style>
  :root {
    --bg: var(--tg-theme-bg-color, #0f172a);
    --text: var(--tg-theme-text-color, #e2e8f0);
    --hint: var(--tg-theme-hint-color, #94a3b8);
    --btn: var(--tg-theme-button-color, #3b82f6);
    --btn-text: var(--tg-theme-button-text-color, #ffffff);
    --card: var(--tg-theme-secondary-bg-color, #1e293b);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh; display: flex; flex-direction: column; overflow: hidden;
  }
  .tabs {
    display: flex; background: var(--card); border-bottom: 1px solid rgba(255,255,255,0.1);
  }
  .tab {
    flex: 1; padding: 15px 5px; text-align: center; font-size: 14px; font-weight: 600;
    color: var(--hint); cursor: pointer; border-bottom: 3px solid transparent;
  }
  .tab.active { color: var(--btn); border-bottom-color: var(--btn); }
  
  .content { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
  
  .msg { padding: 12px 16px; border-radius: 16px; max-width: 85%; line-height: 1.4; word-wrap: break-word; white-space: pre-wrap; font-size: 15px;}
  .user { background: var(--btn); color: var(--btn-text); align-self: flex-end; border-bottom-right-radius: 4px; }
  .bot { background: var(--card); align-self: flex-start; border-bottom-left-radius: 4px; }
  
  .input-area { display: flex; padding: 10px; gap: 8px; background: var(--card); }
  input {
    flex: 1; padding: 14px; border-radius: 20px; border: none; background: rgba(255,255,255,0.1);
    color: var(--text); font-size: 16px; outline: none;
  }
  button {
    padding: 0 20px; border-radius: 20px; border: none; background: var(--btn); color: var(--btn-text);
    font-weight: bold; font-size: 18px;
  }
  
  .img-preview { max-width: 100%; border-radius: 12px; margin-top: 5px; }
</style>
</head>
<body>

<div class="tabs">
  <div class="tab active" onclick="switchTab('chat', this)">💬 Чат</div>
  <div class="tab" onclick="switchTab('image', this)">🎨 Картинки</div>
  <div class="tab" onclick="switchTab('translate', this)">🌐 Перевод</div>
</div>

<div class="content" id="chatBox">
  <div class="msg bot">Привет! Я твой ИИ-помощник. Выбери вкладку сверху и напиши запрос.</div>
</div>

<div class="input-area" id="inputArea">
  <input id="inp" placeholder="Напиши сообщение..." autocomplete="off">
  <button onclick="send()">➤</button>
</div>

<script>
  // Инициализация Telegram WebApp (раскрываем на весь экран)
  let tg = window.Telegram?.WebApp;
  if (tg) { tg.expand(); tg.ready(); }

  let mode = 'chat';

  function switchTab(newMode, el) {
    mode = newMode;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    
    // Прячем инпут для картинок (опционально)
    const inp = document.getElementById('inp');
    if(mode === 'chat') inp.placeholder = "Задай вопрос...";
    if(mode === 'translate') inp.placeholder = "en: привет (или просто текст)";
    if(mode === 'image') inp.placeholder = "Опиши картинку...";
  }

  function addMsg(text, sender) {
    const chatBox = document.getElementById('chatBox');
    const div = document.createElement('div');
    div.className = `msg ${sender}`;
    div.innerText = text;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
    return div;
  }

  async function send() {
    const inp = document.getElementById('inp');
    const text = inp.value.trim();
    if (!text) return;

    addMsg(text, 'user');
    inp.value = '';
    
    const loading = addMsg('Думаю...', 'bot');

    try {
      if (mode === 'chat') {
        const resp = await puter.ai.chat(text);
        loading.innerText = resp.message ? resp.message.content : resp;
      } 
      else if (mode === 'image') {
        loading.innerText = 'Рисую...';
        const img = await puter.ai.txt2img(text);
        loading.innerText = '';
        const imgEl = document.createElement('img');
        imgEl.src = img.src;
        imgEl.className = 'img-preview';
        loading.appendChild(imgEl);
      } 
      else if (mode === 'translate') {
        let target = 'en', content = text;
        if (text.includes(':') && text.split(':')[0].length < 5) {
           target = text.split(':')[0].trim();
           content = text.split(':').slice(1).join(':');
        }
        const resp = await puter.ai.chat(`Translate to ${target}. Output ONLY translation: ${content}`);
        loading.innerText = resp.message ? resp.message.content : resp;
      }
    } catch (e) {
      loading.innerText = "Ошибка: " + e.message;
    }
  }

  document.getElementById('inp').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') send();
  });
</script>
</body>
</html>
