<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
  :root { --bg: #06090e; --card: rgba(19,27,38,0.8); --line: rgba(255,255,255,0.08); --txt: #ffffff; --muted: #8b9bad; --accent: #2aabee; --gold: #ffd700; --nav-bg: rgba(10,15,22,0.95); }
  html,body { height:100%; width:100%; overflow:hidden; font-family: 'Manrope', system-ui, sans-serif; background: var(--bg); color:var(--txt); display:flex; flex-direction:column; user-select:none; }
  .orb{position:fixed;border-radius:50%;filter:blur(80px);opacity:.25;pointer-events:none;z-index:0}
  .orb.a{width:300px;height:300px;background:#2aabee;top:-100px;left:-100px}
  .orb.b{width:250px;height:250px;background:#b06dff;bottom:-50px;right:-50px}
  .app{flex:1; display:flex; flex-direction:column; width:100%; max-width:480px; margin:0 auto; position:relative; z-index:1; height:100dvh;}
  
  /* ШАПКА */
  .topbar{display:flex; align-items:center; justify-content:space-between; padding:12px 16px; padding-top: calc(12px + env(safe-area-inset-top)); gap:10px;}
  .user-profile{display:flex;align-items:center;gap:10px; cursor:pointer;}
  .avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#2aabee,#b06dff);display:grid;place-items:center;font-weight:900;color:#fff;border:2px solid var(--line);background-size:cover;background-position:center;}
  .user-name{font-weight:900;font-size:15px;}
  .top-actions{display:flex;gap:8px;align-items:center}
  .balance{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:14px;font-weight:900;font-size:15px;background:var(--card);border:1px solid var(--line);}
  .ton-diamond{width:18px;height:18px;display:inline-grid;place-items:center;background:linear-gradient(135deg,#0098ea,#7ce0ff);border-radius:50%;color:#03141f;font-size:11px;font-weight:900;}
  .btn-icon{width:38px;height:38px;border-radius:12px;cursor:pointer;font-size:16px;background:var(--card);border:1px solid var(--line);color:var(--txt);display:grid;place-items:center; transition: all 0.15s;}
  .btn-icon:active{transform: scale(0.9);}

  /* КОНТЕНТ */
  .content{flex:1; overflow-y:auto; padding: 0 16px 20px; display:none; flex-direction:column; gap:16px;}
  .content.active{display:flex; animation: slideUpFade 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);}
  @keyframes slideUpFade{from{opacity:0; transform:translateY(15px)}to{opacity:1; transform:none}}

  .card{background:var(--card); backdrop-filter:blur(20px); border:1px solid var(--line); border-radius:24px; padding:18px; display:flex; flex-direction:column; gap:14px;}
  .display-wrap{position:relative; height:140px; display:flex; flex-direction:column; align-items:center; justify-content:center; border-radius:20px; overflow:hidden; background:rgba(0,0,0,0.5); border:1px solid var(--line);}
  .display{font-family:ui-monospace,monospace; font-size:clamp(26px,8vw,38px); font-weight:900; color:var(--txt); word-break:break-all; transition:all .3s;}
  
  @keyframes popIn { 0% { transform: scale(0.5); opacity: 0; filter: blur(5px); } 70% { transform: scale(1.05); opacity: 1; filter: blur(0); } 100% { transform: scale(1); } }
  .display.pop-anim { animation: popIn 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
  
  .rarity-tag{align-self:center; padding:8px 20px; border-radius:20px; font-weight:900; font-size:14px; text-transform:uppercase; opacity:0; transform:translateY(-10px); transition:all .3s;}
  .rarity-tag.show{opacity:1; transform:translateY(0);}
  
  .btn-gen{width:100%; padding:18px; border:none; border-radius:18px; font-size:18px; font-weight:900; color:#03121c; background:linear-gradient(180deg,#7ce0ff,#2aabee); box-shadow:0 6px 0 #0e4a70; transition:all .15s; font-family: 'Manrope', sans-serif; position:relative;}
  .btn-gen:active:not(:disabled){transform:translateY(4px); box-shadow:0 2px 0 #0e4a70;}
  .btn-gen:disabled{opacity:0.7; cursor:not-allowed; filter:grayscale(0.5); transform:translateY(4px); box-shadow:0 2px 0 #0e4a70;}
  
  .stats{display:flex;flex-direction:column;gap:10px;transition:all .4s ease; opacity: 0; transform: translateY(10px);}
  .stats.show { opacity: 1; transform: translateY(0); }
  .stat-head{display:flex;justify-content:space-between;font-size:12px;font-weight:900;color:var(--muted);text-transform:uppercase;margin-bottom:6px}
  .stat-bar{height:8px;border-radius:4px;background:rgba(0,0,0,0.5);overflow:hidden;}
  .stat-fill{height:100%;width:0;border-radius:4px;transition:width 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);}
  .stat.read .stat-fill{background:#2aabee;}
  .stat.liq .stat-fill{background:#3ddc84;}

  .leaderboard{display:flex; flex-direction:column; gap:10px;}
  .lb-item{display:flex; align-items:center; gap:12px; padding:14px; border-radius:18px; background:var(--card); border:1px solid var(--line);}
  .lb-rank{font-size:18px; font-weight:900; width:28px; text-align:center; color:var(--muted);}
  .lb-rank.top1{color:var(--gold); font-size:22px;}
  .lb-avatar{width:38px; height:38px; border-radius:50%; background:#333; background-size:cover; background-position:center;}
  .lb-name{flex:1; font-weight:900; font-size:15px;}
  .lb-bal{font-family:ui-monospace,monospace; font-weight:900; color:var(--gold); font-size: 15px;}

  .profile-header{display:flex; flex-direction:column; align-items:center; gap:12px; margin:20px 0;}
  .profile-avatar{width:90px; height:90px; border-radius:50%; background:linear-gradient(135deg,#2aabee,#b06dff); display:grid; place-items:center; font-size:36px; font-weight:900; color:#fff; border:4px solid var(--card); background-size:cover; background-position:center;}
  .profile-name{font-size:24px; font-weight:900;}
  .profile-id{font-size:13px; color:var(--muted); font-family:monospace; font-weight: 600;}
  .profile-stats{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .p-stat{background:var(--card); border:1px solid var(--line); padding:18px; border-radius:20px; text-align:center;}
  .p-stat .val{font-size:20px; font-weight:900; color:var(--gold);}
  .p-stat .lbl{font-size:11px; color:var(--muted); text-transform:uppercase; font-weight:900; margin-top:6px;}

  .bottom-nav{display:flex; justify-content:space-around; align-items:center; padding:12px 16px; padding-bottom: calc(12px + env(safe-area-inset-bottom)); background:var(--nav-bg); backdrop-filter:blur(20px); border-top:1px solid var(--line);}
  .nav-item{display:flex; flex-direction:column; align-items:center; gap:6px; color:var(--muted); font-size:12px; font-weight:900; cursor:pointer; transition:.2s; padding: 5px 15px; border-radius: 12px;}
  .nav-item.active{color:var(--accent); transform:translateY(-4px); background: rgba(42,171,238,0.1);}
  .nav-item .icon{font-size:22px;}

  /* МОДАЛКИ */
  .modal{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;pointer-events:none;transition:opacity .3s}
  .modal.open{opacity:1;pointer-events:auto}
  .modal-backdrop{position:absolute;inset:0;background:rgba(0,0,0,0.85);backdrop-filter:blur(10px)}
  .modal-card{position:relative;z-index:1;width:100%;max-width:400px;max-height:85vh;display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--line);border-radius:28px;overflow:hidden;transform:scale(.8);transition:transform .3s;}
  .modal.open .modal-card{transform:scale(1)}
  .modal-header{display:flex;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line);}
  .modal-header h2{font-size:16px;font-weight:900;text-transform:uppercase;}
  .modal-close{margin-left:auto;width:34px;height:34px;border-radius:12px;background:var(--card);color:var(--txt);display:grid;place-items:center;cursor:pointer;border:1px solid var(--line); font-weight: 900;}
  .modal-body{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:10px}
  
  .mc-item{display:flex; align-items:center; justify-content:space-between; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:12px; border-left-width:4px;}
  .mc-name{font-family:monospace;font-size:15px;font-weight:900;word-break:break-all;}
  .mc-sell{background:var(--line); border:none; border-radius:10px; padding:8px 12px; color:var(--txt); font-size:14px; font-weight:900; cursor:pointer;}
  .btn-sell-all{width:100%;padding:16px;border-radius:16px;border:none;font-weight:900;font-size:16px;color:#04140e;background:linear-gradient(180deg,#5ff2a4,#3ddc84);box-shadow:0 5px 0 #146b3d; font-family: 'Manrope', sans-serif;}
  .btn-sell-all:active{transform:translateY(3px);box-shadow:0 2px 0 #146b3d}
  
  .toast-wrap{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:200;pointer-events:none}
  .toast{padding:14px 24px;border-radius:16px;background:rgba(15,25,38,0.95);border:1px solid var(--line);font-size:14px;font-weight:900;text-align:center;animation:toastPop .3s, toastOut .3s 2s forwards;}
  @keyframes toastPop{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
  @keyframes toastOut{to{opacity:0;transform:translateY(-20px)}}
  
  /* Экран отладки (появится, если что-то сломается) */
  #debug-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); color: #ff5555; z-index: 9999; padding: 20px; font-family: monospace; font-size: 12px; overflow-y: auto; white-space: pre-wrap; }
</style>

<script>
/* --- ЛОГИКА --- */
const tg = window.Telegram?.WebApp;
const user = tg?.initDataUnsafe?.user;

let myBalance = 5.00;
let myTotal = 0;
let myId = user ? user.id : 0;
let myName = user ? user.first_name : 'Игрок';
let myPhoto = user ? user.photo_url : null;
let localInventory = []; // Если база не работает, храним тут

if (user) {
    document.getElementById('tgName').textContent = myName;
    document.getElementById('profName').textContent = myName;
    document.getElementById('profId').textContent = 'ID: ' + myId;
    if (myPhoto) {
        document.getElementById('tgAvatar').style.background = `url(${myPhoto}) center/cover`;
        document.getElementById('tgAvatar').textContent = '';
        document.getElementById('profAvatar').style.background = `url(${myPhoto}) center/cover`;
        document.getElementById('profAvatar').textContent = '';
    } else {
        const initial = myName[0].toUpperCase();
        document.getElementById('tgAvatar').textContent = initial;
        document.getElementById('profAvatar').textContent = initial;
    }
}

// Безопасная загрузка профиля
async function syncUser() {
    if (!supabaseClient || !myId) { updateUI(); return; }
    try {
        let { data, error } = await supabaseClient.from('users').select('*').eq('id', myId).single();
        if (error && error.code !== 'PGRST116') throw error; // Игнорируем ошибку "не найден"
        
        if (!data) {
            const { data: newUser } = await supabaseClient.from('users').insert([
                { id: myId, first_name: myName, photo_url: myPhoto, balance: 5.00, total_generated: 0 }
            ]).select().single();
            data = newUser;
        }
        if (data) {
            myBalance = parseFloat(data.balance);
            myTotal = data.total_generated;
        }
    } catch(e) { console.log("Ошибка базы:", e); }
    updateUI();
}

function updateUI() {
    document.getElementById('balance').textContent = parseFloat(myBalance).toFixed(2);
    document.getElementById('profBalance').textContent = parseFloat(myBalance).toFixed(2) + ' TON';
    document.getElementById('profTotal').textContent = myTotal;
}

async function addBalance(amount) {
    myBalance += amount;
    updateUI();
    if (supabaseClient && myId) {
        try { await supabaseClient.from('users').update({ balance: myBalance }).eq('id', myId); } catch(e){}
    }
}

function switchTab(tabId, el) {
    document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.getElementById('tab-' + tabId).classList.add('active');
    if(el) el.classList.add('active');
    if (tabId === 'tops') loadLeaderboard();
}

const RARITIES = [
  {id:'common', name:'Обычный', color:'#8b95a5', weight:6000, base:0.05, maxBase:0.15, penalty:0},
  {id:'uncommon', name:'Необычный', color:'#3ddc84', weight:2500, base:0.25, maxBase:0.8, penalty:4},
  {id:'rare', name:'Редкий', color:'#3b9eff', weight:1000, base:1.2, maxBase:5, penalty:10},
  {id:'epic', name:'Эпический', color:'#b06dff', weight:350, base:6, maxBase:25, penalty:22},
  {id:'legendary', name:'Легендарный', color:'#ffb020', weight:90, base:35, maxBase:120, penalty:38},
  {id:'mythic', name:'Мифический', color:'#ff3b6b', weight:10, base:200, maxBase:600, penalty:55},
  {id:'crystal', name:'Кристальная', color:'#00ffff', weight:5, base:1500, maxBase:1500, penalty:65},
  {id:'divine', name:'Божественная', color:'#fff7a1', weight:2, base:500, maxBase:2500, penalty:75},
  {id:'absolute', name:'Абсолютная', color:'#ff00ff', weight:1, base:1000, maxBase:5000, penalty:85},
  {id:'anon', name:'Анонимный', color:'#39ff14', weight:0.1, base:0.001, maxBase:12000, penalty:95},
];
const PREFIX = ['user','pro','mega','neo','dark','light','king','queen','tech','cyber','pixel','ghost','shadow','storm','fire','ice','wolf','cat','ninja','star','moon','sun','red','blue','gold','silver','iron','fast','cold','hot','lucky','crazy','super','ultra','hyper','max','top','best','real','true','wild','free','young','big','black','white','void','echo','alpha','omega','degen','crypto','nft'];
const BASES = ['user','player','hunter','master','god','boss','gamer','coder','dev','trader','wolf','fox','hawk','dragon','tiger','lion','bear','shark','viper','phoenix','knight','wizard','rider','walker','killer','slayer','lord','chief','ace','ghost','ninja','sniper','pilot','racer','king','man'];
const SUFFIX = ['ww','xx','zz','qq','vv','oo','kk','01','07','99','777','2024','2025','_pro','_dev','_tg','_ru','_x','x','v','o','k','a','z','_official','_real'];

const $ = id => document.getElementById(id);
const displayEl = $('display');
const rarityTag = $('rarityTag');
const statsEl = $('stats');
const genBtn = $('genBtn');

function pick(a){return a[Math.floor(Math.random()*a.length)]}
function rnd(n){return Math.floor(Math.random()*n)}
const randLetters = n => { const a='abcdefghijklmnopqrstuvwxyz'; let s=''; for(let i=0;i<n;i++)s+=a[rnd(26)]; return s; };
const randDigits  = n => { let s=''; for(let i=0;i<n;i++)s+=rnd(10); return s; };

function randomName(){
  if (Math.random() < 0.1) return randLetters(6) + randDigits(4);
  const r = Math.random(); let n;
  if (r < 0.30) n = pick(PREFIX) + pick(SUFFIX);
  else if (r < 0.55) n = pick(BASES)  + randLetters(2 + rnd(2));
  else if (r < 0.72) n = pick(PREFIX) + pick(BASES);
  else if (r < 0.86) n = pick(BASES)  + (Math.random() < 0.5 ? '_' : '') + randDigits(2);
  else n = randLetters(4 + rnd(4));
  if (Math.random() < 0.10 && !n.includes('_')) n += '_' + pick(['x','pro','tg','ru','dev','0']);
  return n.toLowerCase().slice(0, 32);
}
function rollRarity(){
  const w = RARITIES.map(r=>r.weight);
  const total = w.reduce((a,b)=>a+b,0);
  let roll = Math.random()*total;
  for (let i=0;i<RARITIES.length;i++){ roll-=w[i]; if(roll<=0) return RARITIES[i]; }
  return RARITIES[0];
}

async function generate(){
  genBtn.disabled = true;
  displayEl.style.color = 'var(--muted)';
  displayEl.classList.remove('pop-anim');
  rarityTag.classList.remove('show');
  statsEl.classList.remove('show');

  const finalName = randomName();
  const rarity = rollRarity();
  
  let mult = 0.75 + Math.random()*0.7;
  let finalBase = rarity.base + Math.random() * (rarity.maxBase - rarity.base);
  let val = Math.max(0.001, finalBase * mult);
  let read = Math.max(5, Math.min(100, Math.round(100 - finalName.length * 5)));
  let liq = Math.max(1, Math.min(99, Math.round(read*0.75 + 25 - rarity.penalty)));
  let sale = Math.max(0.001, val * liq / 100);

  // Анимация прокрутки
  const t0 = performance.now();
  await new Promise(res => {
    const iv = setInterval(() => {
      if (performance.now() - t0 > 600){ clearInterval(iv); res(); }
      else displayEl.textContent = '@' + randomName();
    }, 40);
  });

  displayEl.textContent = '@' + finalName;
  displayEl.style.color = rarity.color;
  displayEl.style.textShadow = `0 0 20px ${rarity.color}`;
  displayEl.classList.add('pop-anim');
  
  rarityTag.textContent = rarity.name;
  rarityTag.style.color = rarity.color;
  rarityTag.style.border = `1px solid ${rarity.color}`;
  rarityTag.classList.add('show');
  
  $('readVal').textContent = read + '%';
  $('liqVal').textContent = liq + '%';
  $('readBar').style.width = read + '%';
  $('liqBar').style.width = liq + '%';
  statsEl.classList.add('show');

  // Сохраняем в базу (если не выйдет, сохраняем локально)
  const newItem = { username: finalName, rarity_name: rarity.name, rarity_color: rarity.color, price: sale };
  
  if (supabaseClient && myId) {
      try {
          await supabaseClient.from('usernames').insert([{ 
              user_id: myId, username: finalName, rarity_name: rarity.name, rarity_color: rarity.color, price: sale 
          }]);
          myTotal++;
          await supabaseClient.from('users').update({ total_generated: myTotal }).eq('id', myId);
      } catch(e) {
          console.log("DB Save error:", e);
          localInventory.push(newItem);
      }
  } else {
      localInventory.push(newItem);
  }
  
  updateUI();
  genBtn.disabled = false; // ВСЕГДА ВКЛЮЧАЕМ КНОПКУ ОБРАТНО
}

/* --- КОЛЛЕКЦИЯ --- */
async function openCollection() {
    openModal('collectionModal');
    const list = $('invList');
    list.innerHTML = '<div style="text-align:center; padding:20px; color:var(--muted); font-weight:800;">Загрузка...</div>';
    
    let data = [];
    if (supabaseClient && myId) {
        try {
            const res = await supabaseClient.from('usernames').select('*').eq('user_id', myId).order('price', {ascending: false});
            if (res.data) data = res.data;
        } catch(e) {}
    }
    
    // Добавляем локальные, если база не сработала
    data = [...data, ...localInventory];
    
    if(data.length === 0) { list.innerHTML = '<div style="text-align:center;color:var(--muted);padding:20px; font-weight:800;">Пусто</div>'; return; }
    
    list.innerHTML = data.map((item, index) => `
        <div class="mc-item" style="border-left-color:${item.rarity_color};">
            <div style="flex:1;">
                <div class="mc-name" style="color:${item.rarity_color}">@${item.username}</div>
                <div style="font-size:11px; color:var(--muted); margin-top:4px; font-weight:800;">${item.rarity_name}</div>
            </div>
            <div style="font-size:15px; font-weight:900; color:var(--gold); margin-right:12px;">${parseFloat(item.price).toFixed(2)} T</div>
            <button class="mc-sell" onclick="sellItem('${item.id || 'local'}', ${item.price}, ${index})">💵</button>
        </div>
    `).join('');
}

async function sellItem(id, price, idx) {
    if (id !== 'local' && supabaseClient && myId) {
        try { await supabaseClient.from('usernames').delete().eq('id', id); } catch(e){}
    } else {
        localInventory.splice(idx, 1);
    }
    await addBalance(price);
    openCollection(); // Перерисовываем
}

async function sellAll() {
    let tot = 0;
    if (supabaseClient && myId) {
        try {
            const { data } = await supabaseClient.from('usernames').select('*').eq('user_id', myId);
            if(data && data.length > 0) {
                tot = data.reduce((s,i)=>s+parseFloat(i.price),0);
                await supabaseClient.from('usernames').delete().eq('user_id', myId);
            }
        } catch(e){}
    }
    
    // Продаем локальные
    if(localInventory.length > 0) {
        tot += localInventory.reduce((s,i)=>s+parseFloat(i.price),0);
        localInventory = [];
    }
    
    if(tot > 0) {
        await addBalance(tot);
        showToast(`+${tot.toFixed(2)} TON`, '#3ddc84');
    }
    closeModal('collectionModal');
}

/* --- ТОПЫ --- */
async function loadLeaderboard() {
    const list = $('leaderboardList');
    if (!supabaseClient) {
        list.innerHTML = '<div style="text-align:center;color:var(--muted);padding:20px; font-weight:800;">База данных не подключена</div>';
        return;
    }
    try {
        const { data } = await supabaseClient.from('users').select('*').order('balance', {ascending: false}).limit(50);
        if (!data) return;
        list.innerHTML = data.map((u, i) => `
            <div class="lb-item">
                <div class="lb-rank ${i===0?'top1':i===1?'top2':i===2?'top3':''}">${i+1}</div>
                <div class="lb-avatar" style="${u.photo_url ? `background-image:url(${u.photo_url})` : 'background:linear-gradient(135deg,#2aabee,#b06dff)'}"></div>
                <div class="lb-name">${u.first_name}</div>
                <div class="lb-bal">${parseFloat(u.balance).toFixed(1)} TON</div>
            </div>
        `).join('');
    } catch(e) {}
}

/* --- УТИЛИТЫ --- */
function openModal(id) { $(id).classList.add('open'); }
function closeModal(id) { $(id).classList.remove('open'); }
function showToast(text, color) {
    const el = document.createElement('div');
    el.className = 'toast';
    el.style.color = color;
    el.textContent = text;
    document.getElementById('toastWrap').appendChild(el);
    setTimeout(()=>el.remove(), 2300);
}

genBtn.addEventListener('click', generate);
syncUser();
</script>
