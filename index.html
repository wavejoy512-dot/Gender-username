<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Geners Username</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;800;900&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
  :root { 
    --bg: #06090e; --card: #141d29; --line: rgba(255,255,255,0.1); 
    --txt: #ffffff; --muted: #8b9bad; --accent: #2aabee; --gold: #ffd700; --silver: #c0c0c0; --bronze: #cd7f32;
    --nav-bg: rgba(10,15,22,0.95); 
  }
  
  body.low-end .orb { display: none; }
  body.low-end .card { backdrop-filter: none; box-shadow: none; border: 1px solid var(--line); }
  body.low-end .btn-gen::before { display: none; }
  body.low-end .shake-screen { animation: none !important; }
  body.low-end .particle { display: none !important; }
  body.low-end .modal-backdrop { backdrop-filter: none; background: rgba(0,0,0,0.95); }
  
  html,body { height:100%; width:100%; overflow:hidden; font-family: 'Manrope', system-ui, sans-serif; background: var(--bg); color:var(--txt); display:flex; flex-direction:column; user-select:none; }
  
  .orb{position:fixed;border-radius:50%;filter:blur(80px);opacity:.3;pointer-events:none;z-index:0;animation: float 10s infinite alternate}
  .orb.a{width:300px;height:300px;background:#2aabee;top:-100px;left:-100px}
  .orb.b{width:250px;height:250px;background:#b06dff;bottom:-50px;right:-50px;animation-delay: -5s}
  @keyframes float { 0% { transform: translate(0, 0); } 100% { transform: translate(20px, 20px); } }

  .app{flex:1; display:flex; flex-direction:column; width:100%; max-width:480px; margin:0 auto; position:relative; z-index:1; height:100dvh;}
  
  /* ШАПКА */
  .topbar{display:flex; align-items:center; justify-content:space-between; padding:12px 16px; padding-top: calc(12px + env(safe-area-inset-top)); gap:10px;}
  .user-profile{display:flex;align-items:center;gap:10px; cursor:pointer; flex:1; overflow: hidden;}
  .avatar{width:38px;height:38px; min-width: 38px; border-radius:50%;background:linear-gradient(135deg,#2aabee,#b06dff);display:grid;place-items:center;font-weight:900;color:#fff;border:2px solid var(--line);background-size:cover;background-position:center; font-size: 16px;}
  .user-name{font-weight:900;font-size:15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
  .top-actions{display:flex;gap:8px;align-items:center}
  .balance{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:14px;font-weight:900;font-size:15px;background:var(--card);border:1px solid var(--line); box-shadow: 0 4px 10px rgba(0,0,0,0.3);}
  .ton-diamond{width:18px;height:18px;display:inline-grid;place-items:center;background:linear-gradient(135deg,#0098ea,#7ce0ff);border-radius:50%;color:#03141f;font-size:11px;font-weight:900;}
  
  .btn-icon{background:transparent;border:none;color:#fff;cursor:pointer;padding:6px;display:flex;align-items:center;justify-content:center;transition:0.2s;}
  .btn-icon:active{transform:scale(0.9);}

  .content{flex:1; overflow-y:auto; padding: 0 16px 20px; display:none; flex-direction:column; gap:16px;}
  .content.active{display:flex; animation: slideUpFade 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);}
  @keyframes slideUpFade{from{opacity:0; transform:translateY(15px)}to{opacity:1; transform:none}}

  .card{background:var(--card); border:1px solid var(--line); border-radius:24px; padding:18px; display:flex; flex-direction:column; gap:14px; box-shadow: 0 10px 30px rgba(0,0,0,0.4);}
  
  /* ДИСПЛЕЙ */
  .display-wrap{position:relative; height:150px; display:flex; flex-direction:column; align-items:center; justify-content:center; border-radius:20px; overflow:hidden; background:#080d13; border:1px solid #1a2635; box-shadow: inset 0 10px 30px rgba(0,0,0,0.8); cursor: pointer; transition: transform 0.1s;}
  .display-wrap:active { transform: scale(0.98); }
  
  .copy-hint { position: absolute; bottom: 8px; font-size: 10px; color: var(--muted); font-weight: 800; opacity: 0; transition: opacity 0.3s; z-index: 2;}
  .display-wrap:active .copy-hint { opacity: 1; }

  .price-float {
    position: absolute; top: 12px; right: 12px;
    background: linear-gradient(180deg, #2a1f0d, #1a1306);
    border: 1px solid #4d3b1a; border-radius: 10px; padding: 5px 12px;
    font-family: ui-monospace, monospace; font-size: 15px; font-weight: 900; color: var(--gold);
    opacity: 0; transform: translateY(-10px); transition: all 0.3s;
    box-shadow: 0 4px 10px rgba(0,0,0,0.6);
  }
  .price-float.show { opacity: 1; transform: translateY(0); }

  .display{font-family:ui-monospace,monospace; font-size:clamp(26px,8vw,38px); font-weight:900; color:var(--txt); word-break:break-all; transition:all .3s; z-index: 2; user-select: all; text-align: center; padding: 0 10px;}
  
  @keyframes dropIn { 0% { transform: translateY(-100px) scale(0.5); opacity: 0; filter: blur(10px); } 70% { transform: translateY(5px) scale(1.1); opacity: 1; filter: blur(0); } 100% { transform: translateY(0) scale(1); } }
  .display.pop-anim { animation: dropIn 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
  
  @keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(5px); } }
  .shake-screen { animation: shake 0.5s ease; }

  .rarity-tag{align-self:center; padding:8px 20px; border-radius:20px; font-weight:900; font-size:14px; text-transform:uppercase; opacity:0; transform:translateY(-10px); transition:all .3s; z-index: 2;}
  .rarity-tag.show{opacity:1; transform:translateY(0);}
  
  .btn-gen{width:100%; padding:18px; border:none; border-radius:18px; font-size:18px; font-weight:900; color:#03121c; background:linear-gradient(180deg,#7ce0ff,#2aabee); box-shadow:0 6px 0 #0e4a70; transition:all .15s; font-family: 'Manrope', sans-serif; position:relative; overflow: hidden;}
  .btn-gen::before { content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent); transform: skewX(-20deg); animation: shine 3s infinite; }
  @keyframes shine { 0% { left: -100%; } 20% { left: 100%; } 100% { left: 100%; } }
  .btn-gen:active:not(:disabled){transform:translateY(4px); box-shadow:0 2px 0 #0e4a70;}
  .btn-gen:disabled{opacity:0.7; cursor:not-allowed; filter:grayscale(0.5); transform:translateY(4px); box-shadow:0 2px 0 #0e4a70;}

  .stats{display:flex;flex-direction:column;gap:10px;transition:all .4s ease; opacity: 0; transform: translateY(10px);}
  .stats.show { opacity: 1; transform: translateY(0); }
  .stat-head{display:flex;justify-content:space-between;font-size:12px;font-weight:900;color:var(--muted);text-transform:uppercase;margin-bottom:6px}
  .stat-bar{height:8px;border-radius:4px;background:#080d13;overflow:hidden; border: 1px solid #1a2635;}
  .stat-fill{height:100%;width:0;border-radius:4px;transition:width 0.8s cubic-bezier(0.2, 0.8, 0.2, 1); box-shadow: 0 0 10px currentColor;}
  .stat.read .stat-fill{background:#2aabee; color: #2aabee;}
  .stat.liq .stat-fill{background:#3ddc84; color: #3ddc84;}

  .mini-btns{display:flex; gap:10px;}
  .btn-mini{
    flex:1; height:60px; border-radius:16px; border:1px solid var(--line);
    background: #141d29; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    font-size: 12px; font-weight: 900; cursor: pointer; transition: all 0.2s;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.1), 0 4px 10px rgba(0,0,0,0.3);
  }
  .btn-mini svg { stroke: var(--muted); transition: 0.2s; }
  .btn-mini:active { transform: scale(0.95); background: #1a2635; }
  .btn-mini:active svg { stroke: #fff; }

  /* Топы */
  .leaderboard{display:flex; flex-direction:column; gap:10px;}
  .lb-item{display:flex; align-items:center; gap:12px; padding:14px; border-radius:18px; background:var(--card); border:1px solid var(--line);}
  .lb-rank{font-size:18px; font-weight:900; width:28px; text-align:center; color:var(--muted);}
  
  .lb-rank.top1{color:var(--gold); font-size:22px; text-shadow: 0 0 12px rgba(255,215,0,0.6);}
  .lb-rank.top2{color:var(--silver); font-size:20px; text-shadow: 0 0 10px rgba(192,192,192,0.6);}
  .lb-rank.top3{color:var(--bronze); font-size:20px; text-shadow: 0 0 10px rgba(205,127,50,0.6);}
  
  .lb-avatar{width:38px; height:38px; border-radius:50%; background:#333; background-size:cover; background-position:center; display:grid; place-items:center; font-weight:900; color:#fff; font-size:16px;}
  .lb-name{flex:1; font-weight:900; font-size:15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
  .lb-bal{font-family:ui-monospace,monospace; font-weight:900; color:var(--gold); font-size: 15px;}

  /* Профиль */
  .profile-header{display:flex; flex-direction:column; align-items:center; gap:12px; margin:20px 0;}
  .profile-avatar{width:90px; height:90px; border-radius:50%; background:linear-gradient(135deg,#2aabee,#b06dff); display:grid; place-items:center; font-size:36px; font-weight:900; color:#fff; border:4px solid var(--card); background-size:cover; background-position:center; box-shadow: 0 10px 20px rgba(0,0,0,0.5);}
  .profile-name{font-size:24px; font-weight:900;}
  .profile-id{font-size:13px; color:var(--muted); font-family:monospace; font-weight: 600;}
  .profile-stats{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .p-stat{background:var(--card); border:1px solid var(--line); padding:18px; border-radius:20px; text-align:center;}
  .p-stat .val{font-size:20px; font-weight:900; color:var(--gold); text-shadow: 0 0 10px rgba(255,215,0,0.3);}
  .p-stat .lbl{font-size:11px; color:var(--muted); text-transform:uppercase; font-weight:900; margin-top:6px;}

  /* Нижнее меню */
  .bottom-nav{display:flex; justify-content:space-around; align-items:center; padding:12px 16px; padding-bottom: calc(12px + env(safe-area-inset-bottom)); background:var(--nav-bg); border-top:1px solid var(--line);}
  .nav-item{display:flex; flex-direction:column; align-items:center; gap:6px; color:var(--muted); font-size:12px; font-weight:900; cursor:pointer; transition:.3s; padding: 6px 16px; border-radius: 14px;}
  .nav-item.active{color:var(--accent); background: rgba(42,171,238,0.1); transform: translateY(-2px); box-shadow: 0 0 15px rgba(42,171,238,0.2);}
  .nav-item .icon{display:flex; align-items:center; justify-content:center;}
  .nav-item .icon svg{width:24px; height:24px; transition:0.2s;}
  .nav-item.active .icon svg { stroke: var(--accent); }

  /* Модалки */
  .modal{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;pointer-events:none;transition:opacity .3s}
  .modal.open{opacity:1;pointer-events:auto}
  .modal-backdrop{position:absolute;inset:0;background:rgba(0,0,0,0.85);backdrop-filter:blur(8px)}
  .modal-card{position:relative;z-index:1;width:100%;max-width:400px;max-height:85vh;display:flex;flex-direction:column;background:#0f151e;border:1px solid var(--line);border-radius:28px;overflow:hidden;transform:scale(.85);transition:transform .3s;}
  .modal.open .modal-card{transform:scale(1)}
  .modal-header{display:flex;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line);}
  .modal-header h2{font-size:16px;font-weight:900;text-transform:uppercase; display:flex; align-items:center; gap:8px;}
  .modal-header h2 svg { stroke: var(--accent); }
  .modal-close{margin-left:auto;width:34px;height:34px;border-radius:12px;background:var(--card);color:var(--txt);display:grid;place-items:center;cursor:pointer;border:1px solid var(--line); transition: 0.2s;}
  .modal-close svg { stroke: var(--muted); }
  .modal-close:active { background: var(--line); }
  .modal-close:active svg { stroke: #fff; }
  .modal-body{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:10px}
  
  .mc-item{display:flex; align-items:center; justify-content:space-between; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:12px; border-left-width:4px;}
  .mc-name{font-family:monospace;font-size:15px;font-weight:900;word-break:break-all;}
  .mc-sell{background:#1a2635; border:none; border-radius:10px; padding:8px 12px; color:var(--txt); cursor:pointer; transition: 0.2s; display:flex; align-items:center; justify-content:center;}
  .mc-sell svg { stroke: var(--gold); }
  .mc-sell:active{background: var(--gold);}
  .mc-sell:active svg { stroke: #000; }
  
  .btn-sell-all{width:100%;padding:16px;border-radius:16px;border:none;font-weight:900;font-size:16px;color:#04140e;background:linear-gradient(180deg,#5ff2a4,#3ddc84);box-shadow:0 5px 0 #146b3d; font-family: 'Manrope', sans-serif; display:flex; align-items:center; justify-content:center; gap:8px;}
  .btn-sell-all:active{transform:translateY(3px);box-shadow:0 2px 0 #146b3d}
  .btn-sell-all svg { stroke: #04140e; }

  .cat-item{display:flex; align-items:center; justify-content:space-between; padding:14px; border-radius:14px; background:var(--card); border:1px solid var(--line); border-left-width:4px;}
  
  /* Настройки */
  .setting-row { display: flex; justify-content: space-between; align-items: center; padding: 16px; background: var(--card); border-radius: 16px; border: 1px solid var(--line); margin-bottom: 8px; }
  .setting-info { display: flex; align-items: center; gap: 12px; }
  .setting-icon { width: 40px; height: 40px; border-radius: 12px; background: rgba(255,255,255,0.05); display: grid; place-items: center; }
  .setting-icon svg { stroke: var(--accent); }
  .setting-text { display: flex; flex-direction: column; gap: 2px; }
  .setting-title { font-weight: 900; font-size: 15px; }
  .setting-desc { font-size: 11px; color: var(--muted); font-weight: 600; }
  
  .switch { position: relative; display: inline-block; width: 50px; height: 28px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #1a2635; transition: .4s; border-radius: 34px; border: 1px solid var(--line); }
  .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 4px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
  input:checked + .slider { background-color: var(--accent); }
  input:checked + .slider:before { transform: translateX(22px); }

  .toast-wrap{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:200;pointer-events:none; width: 90%; max-width: 350px;}
  .toast{padding:14px 24px;border-radius:16px;background:rgba(15,25,38,0.95);border:1px solid var(--line);font-size:14px;font-weight:900;text-align:center;animation:toastPop .3s, toastOut .3s 2s forwards; word-wrap: break-word; line-height: 1.4;}
  @keyframes toastPop{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
  @keyframes toastOut{to{opacity:0;transform:translateY(-20px)}}

  .particle { position: absolute; width: 8px; height: 8px; border-radius: 50%; pointer-events: none; z-index: 10; }
</style>
</head>
<body>

<div class="orb a"></div>
<div class="orb b"></div>

<div class="app">
  <div class="topbar">
    <div class="user-profile" onclick="switchTab('profile', this)">
      <div class="avatar" id="tgAvatar">?</div>
      <div class="user-name" id="tgName">Загрузка...</div>
    </div>
    <div class="top-actions">
      <div class="balance">
        <span class="ton-diamond">T</span>
        <span id="balance">0.00</span>
      </div>
      <button class="btn-icon" onclick="openModal('settingsModal')">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      </button>
    </div>
  </div>

  <div class="content active" id="tab-home">
    <div class="card" style="margin-top:10px;">
      <div class="display-wrap" id="displayWrap" onclick="copyUsername()">
        <div class="price-float" id="priceFloat">0.00 TON</div>
        <div class="display" id="display">@username</div>
        <div class="copy-hint">Нажми, чтобы скопировать</div>
      </div>
      <div class="rarity-tag" id="rarityTag"></div>
      <div class="stats" id="stats">
        <div class="stat read">
          <div class="stat-head"><span>Читабельность</span><span id="readVal">0%</span></div>
          <div class="stat-bar"><div class="stat-fill" id="readBar"></div></div>
        </div>
        <div class="stat liq">
          <div class="stat-head"><span>Ликвидность</span><span id="liqVal">0%</span></div>
          <div class="stat-bar"><div class="stat-fill" id="liqBar"></div></div>
        </div>
      </div>
      <button class="btn-gen" id="genBtn">⚡ СГЕНЕРИРОВАТЬ</button>
    </div>
    
    <div class="mini-btns">
      <button class="btn-mini" onclick="openWheel()">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 2v20M2 12h20"></path><path d="M4.93 4.93l14.14 14.14M4.93 19.07L19.07 4.93"></path><circle cx="12" cy="12" r="3"></circle></svg>
        Колесо
      </button>
      <button class="btn-mini" onclick="openCollection()">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
        Коллекция
      </button>
      <button class="btn-mini" onclick="openModal('catalogModal')">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
        Каталог
      </button>
    </div>
  </div>

  <div class="content" id="tab-tops">
    <h2 style="font-size:22px; font-weight:900; margin-top:10px;">🏆 Топ игроков</h2>
    <div class="leaderboard" id="leaderboardList"></div>
  </div>

  <div class="content" id="tab-profile">
    <div class="profile-header">
      <div class="profile-avatar" id="profAvatar">?</div>
      <div class="profile-name" id="profName">Загрузка...</div>
      <div class="profile-id" id="profId">ID: ...</div>
    </div>
    <div class="profile-stats">
      <div class="p-stat">
        <div class="val" id="profBalance">0.00 TON</div>
        <div class="lbl">Баланс</div>
      </div>
      <div class="p-stat">
        <div class="val" id="profTotal">0</div>
        <div class="lbl">Всего юзов</div>
      </div>
    </div>
  </div>

  <div class="bottom-nav">
    <div class="nav-item active" onclick="switchTab('home', this)">
      <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.8a2 2 0 0 0 1.3 1.3L21 12l-5.8 1.9a2 2 0 0 0-1.3 1.3L12 21l-1.9-5.8a2 2 0 0 0-1.3-1.3L3 12l5.8-1.9a2 2 0 0 0 1.3-1.3L12 3z"></path></svg></div>
      <span>Генератор</span>

<script>
    // 1. Инициализация Telegram
    const tg = window.Telegram?.WebApp;

    const user = tg?.initDataUnsafe?.user;

    // 2. Настройки
    let settings = JSON.parse(localStorage.getItem('geners_settings')) || {
        sound: true, vibration: true, animations: true, lowEnd: false
    };

    function applySettings() {
        document.getElementById('setSound').checked = settings.sound;
        document.getElementById('setVibration').checked = settings.vibration;
        document.getElementById('setAnimations').checked = settings.animations;
        document.getElementById('setLowEnd').checked = settings.lowEnd;
        if (settings.lowEnd) document.body.classList.add('low-end');
        else document.body.classList.remove('low-end');
    }

    function toggleSetting(key, val) {
        settings[key] = val;
        localStorage.setItem('geners_settings', JSON.stringify(settings));
        applySettings();
        playSound('roll');
        vibrate('light');
    }
    applySettings();

    // 3. Звуки и Вибрация
    let audioCtx;
    function playSound(type) {
        if (!settings.sound) return;
        try {
            if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            if(type === 'roll') {
                osc.type = 'square'; osc.frequency.setValueAtTime(400 + Math.random()*200, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
                osc.start(); osc.stop(audioCtx.currentTime + 0.05);
            } else if (type === 'win') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
                osc.start(); osc.stop(audioCtx.currentTime + 0.5);
            }
        } catch(e) {}
    }

    function vibrate(type) {
        if (!settings.vibration || !tg?.HapticFeedback) return;
        if (type === 'light') tg.HapticFeedback.impactOccurred('light');
        if (type === 'medium') tg.HapticFeedback.impactOccurred('medium');
        if (type === 'heavy') tg.HapticFeedback.impactOccurred('heavy');
        if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
        if (type === 'error') tg.HapticFeedback.notificationOccurred('error');
    }

    // 4. База Данных
    let supabaseClient = null;
    try {
        if (typeof supabase !== 'undefined') {
            supabaseClient = supabase.createClient(
                'https://ikadpwkwvphslxxskvbl.supabase.co', 
                'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlrYWRwd2t3dnBoc2x4eHNrdmJsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM0NjQ2MjgsImV4cCI6MjEwOTA0MDYyOH0.koLyEKQyGSb4X5cCuMIpsR4zlp9OnWvfEO5PtTbQel8'
            );
        }
    } catch(e) { console.log("Ошибка подключения:", e); }

    // 5. Данные (МУЛЬТИ-СОХРАНЕНИЕ)
    let gameData = {
        balance: 5.00,
        total: 0,
        inventory: []
    };

    function loadLocalData() {
        try {
            const saved = localStorage.getItem('geners_data');
            if (saved) {
                const parsed = JSON.parse(saved);
                // Если баланс 0, это не должно сбрасывать его до 5.00. Проверяем на undefined.
                gameData.balance = parsed.balance !== undefined ? parseFloat(parsed.balance) : 5.00;
                gameData.total = parsed.total !== undefined ? parseInt(parsed.total) : 0;
                gameData.inventory = Array.isArray(parsed.inventory) ? parsed.inventory : [];
            }
        } catch(e) { console.error("Local storage error", e); }
    }

    function saveLocalData() {
        try {
            localStorage.setItem('geners_data', JSON.stringify(gameData));
            // Дублируем в Telegram CloudStorage для 100% сохранности
            if (tg && tg.CloudStorage) {
                tg.CloudStorage.setItem('geners_balance', gameData.balance.toString(), () => {});
                tg.CloudStorage.setItem('geners_total', gameData.total.toString(), () => {});
                tg.CloudStorage.setItem('geners_inventory', JSON.stringify(gameData.inventory), () => {});
            }
        } catch(e) { console.error("Local save error", e); }
    }

    let myId = user ? user.id : 0;
    let myName = user ? user.first_name : 'Игрок';
    let myPhoto = user ? user.photo_url : null;
    let currentUsername = ''; 

    if (user) {
        document.getElementById('tgName').textContent = myName;
        document.getElementById('profName').textContent = myName;
        document.getElementById('profId').textContent = 'ID: ' + myId;
        const initial = myName[0].toUpperCase();
        if (myPhoto) {
            document.getElementById('tgAvatar').style.background = `url(${myPhoto}) center/cover`;
            document.getElementById('tgAvatar').textContent = '';
            document.getElementById('profAvatar').style.background = `url(${myPhoto}) center/cover`;
            document.getElementById('profAvatar').textContent = '';
        } else {
            document.getElementById('tgAvatar').textContent = initial;
            document.getElementById('profAvatar').textContent = initial;
        }
    }

    // 6. UI Функции
    function updateUI() {
        document.getElementById('balance').textContent = gameData.balance.toFixed(2);
        document.getElementById('profBalance').textContent = gameData.balance.toFixed(2) + ' TON';
        document.getElementById('profTotal').textContent = gameData.total;
        saveLocalData();
    }

    function switchTab(tabId, el) {
        document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById('tab-' + tabId).classList.add('active');
        if(el) el.classList.add('active');
        if (tabId === 'tops') loadLeaderboard();
        vibrate('light');
    }

    function openModal(id) { document.getElementById(id).classList.add('open'); vibrate('light'); }
    function closeModal(id) { document.getElementById(id).classList.remove('open'); }
    
    function showToast(text, color) {
        const el = document.createElement('div');
        el.className = 'toast';
        el.style.color = color;
        el.textContent = text;
        document.getElementById('toastWrap').appendChild(el);
        setTimeout(()=>el.remove(), 2300);
    }

    function copyUsername() {
        if (!currentUsername) return;
        const textToCopy = '@' + currentUsername;
        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(textToCopy).then(() => {
                showToast('Скопировано: ' + textToCopy, '#3ddc84');
                vibrate('success');
            }).catch(() => fallbackCopy(textToCopy));
        } else {
            fallbackCopy(textToCopy);
        }
    }

    function fallbackCopy(text) {
        const textArea = document.createElement("textarea");
        textArea.value = text; document.body.appendChild(textArea);
        textArea.focus(); textArea.select();
        try {
            document.execCommand('copy'); showToast('Скопировано: ' + text, '#3ddc84'); vibrate('success');
        } catch (err) { showToast('Ошибка копирования', '#ff3b6b'); }
        document.body.removeChild(textArea);
    }

    function animatePrice(targetPrice) {
        const el = document.getElementById('priceFloat');
        el.classList.add('show');
        let start = 0;
        const duration = 1000; const startTime = performance.now();
        function update(currentTime) {
            const elapsed = currentTime - startTime;
            const progress = Math.min(elapsed / duration, 1);
            const easeOut = 1 - Math.pow(1 - progress, 3);
            const current = start + (targetPrice - start) * easeOut;
            el.innerHTML = current.toFixed(2) + ' TON';
            if (progress < 1) requestAnimationFrame(update);
        }
        requestAnimationFrame(update);
    }

    function createParticles(color) {
        if (!settings.animations || settings.lowEnd) return;
        const wrap = document.getElementById('displayWrap');
        for (let i = 0; i < 30; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.background = color; p.style.boxShadow = `0 0 10px ${color}`;
            p.style.left = '50%'; p.style.top = '50%';
            const angle = Math.random() * Math.PI * 2;
            const dist = 50 + Math.random() * 100;
            const tx = Math.cos(angle) * dist; const ty = Math.sin(angle) * dist;
            const anim = p.animate([
                { transform: 'translate(-50%, -50%) scale(1)', opacity: 1 },
                { transform: `translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px)) scale(0)`, opacity: 0 }
            ], { duration: 600 + Math.random()*400, easing: 'cubic-bezier(0.1, 0.8, 0.2, 1)' });
            anim.onfinish = () => p.remove(); wrap.appendChild(p);
        }
    }

    // 7. СИНХРОНИЗАЦИЯ (Безопасная)
    async function syncUser() {
        loadLocalData();
        updateUI();

        // Подгружаем из облака Telegram (высший приоритет)
        if (tg && tg.CloudStorage) {
            tg.CloudStorage.getItem('geners_balance', (err, val) => {
                if (val) {
                    const cloudBal = parseFloat(val);
                    if (cloudBal > gameData.balance) {
                        gameData.balance = cloudBal;
                        updateUI();
                    }
                }
            });
            tg.CloudStorage.getItem('geners_total', (err, val) => {
                if (val) {
                    const cloudTot = parseInt(val);
                    if (cloudTot > gameData.total) {
                        gameData.total = cloudTot;
                        updateUI();
                    }
                }
            });
        }

        if (!supabaseClient || !myId) return;
        try {
            let { data, error } = await supabaseClient.from('users').select('*').eq('id', myId).single();
            if (error && error.code !== 'PGRST116') throw error; 
            
            if (!data) {
                await supabaseClient.from('users').insert([{ 
                    id: myId, first_name: myName, photo_url: myPhoto, 
                    balance: gameData.balance, total_generated: gameData.total 
                }]);
            } else {
                const dbBalance = parseFloat(data.balance) || 0;
                const dbTotal = parseInt(data.total_generated) || 0;

                // Если в облаке Supabase больше, берем его
                if (dbBalance > gameData.balance) {
                    gameData.balance = dbBalance;
                    gameData.total = dbTotal;
                    saveLocalData();
                } 
                // Если локально больше, обновляем Supabase
                else if (gameData.balance > dbBalance) {
                    await supabaseClient.from('users').update({ 
                        balance: gameData.balance, total_generated: gameData.total 
                    }).eq('id', myId);
                }
            }
        } catch(e) { console.log("DB Error:", e); }
        updateUI();
    }

    // 8. Генерация
    const RARITIES = [
      {id:'common',    name:'Обычный',     color:'#8b95a5', weight:4000, base:0.05,  maxBase:0.15,  penalty:0},
      {id:'uncommon',  name:'Необычный',   color:'#3ddc84', weight:2500, base:0.25,  maxBase:0.8,   penalty:4},

      {id:'divine',    name:'Божественная',color:'#fff7a1', weight:40,   base:500,   maxBase:2500,  penalty:75},
      {id:'absolute',  name:'Абсолютная',  color:'#ff00ff', weight:9,    base:1000,  maxBase:5000,  penalty:85},
      {id:'anon',      name:'Анонимный',   color:'#39ff14', weight:1,    base:0.001, maxBase:12000, penalty:95},
    ];
    const PREFIX = ['user','pro','mega','neo','dark','light','king','queen','tech','cyber','pixel','ghost','shadow','storm','fire','ice','wolf','cat','ninja','star','moon','sun','red','blue','gold','silver','iron','fast','cold','hot','lucky','crazy','super','ultra','hyper','max','top','best','real','true','wild','free','young','big','black','white','void','echo','alpha','omega','degen','crypto','nft'];
    const BASES = ['user','player','hunter','master','god','boss','gamer','coder','dev','trader','wolf','fox','hawk','dragon','tiger','lion','bear','shark','viper','phoenix','knight','wizard','rider','walker','killer','slayer','lord','chief','ace','ghost','ninja','sniper','pilot','racer','king','man'];
    const SUFFIX = ['ww','xx','zz','qq','vv','oo','kk','01','07','99','777','2024','2025','_pro','_dev','_tg','_ru','_x','x','v','o','k','a','z','_official','_real'];

    function pick(a){return a[Math.floor(Math.random()*a.length)]}
    function rnd(n){return Math.floor(Math.random()*n)}
    const randLetters = n => { const a='abcdefghijklmnopqrstuvwxyz'; let s=''; for(let i=0;i<n;i++)s+=a[rnd(26)]; return s; };
    const randDigits  = n => { let s=''; for(let i=0;i<n;i++)s+=rnd(10); return s; };

    function randomName(){
      if (Math.random() < 0.1) return randLetters(6) + randDigits(4);
      const r = Math.random(); let n;
      if (r < 0.30) n = pick(PREFIX) + pick(SUFFIX);
      else if (r < 0.55) n = pick(BASES)  + randLetters(2 + rnd(2));
      else if (r < 0.72) n = pick(PREFIX) + pick(BASES);
      else if (r < 0.86) n = pick(BASES)  + (Math.random() < 0.5 ? '_' : '') + randDigits(2);
      else n = randLetters(4 + rnd(4));
      if (Math.random() < 0.10 && !n.includes('_')) n += '_' + pick(['x','pro','tg','ru','dev','0']);
      return n.toLowerCase().slice(0, 32);
    }
    function rollRarity(){
      const w = RARITIES.map(r=>r.weight);
      const total = w.reduce((a,b)=>a+b,0);
      let roll = Math.random()*total;
      for (let i=0;i<RARITIES.length;i++){ roll-=w[i]; if(roll<=0) return RARITIES[i]; }
      return RARITIES[0];
    }

    const displayEl = document.getElementById('display');
    const rarityTag = document.getElementById('rarityTag');
    const statsEl = document.getElementById('stats');
    const genBtn = document.getElementById('genBtn');
    const priceFloat = document.getElementById('priceFloat');

    async function generate(){
      genBtn.disabled = true;
      displayEl.style.color = 'var(--muted)';
      displayEl.classList.remove('pop-anim');
      rarityTag.classList.remove('show');
      statsEl.classList.remove('show');
      priceFloat.classList.remove('show');
      vibrate('light');

      const finalName = randomName();
      const rarity = rollRarity();
      
      let mult = 0.75 + Math.random()*0.7;
      let finalBase = rarity.base + Math.random() * (rarity.maxBase - rarity.base);
      let val = Math.max(0.001, finalBase * mult);
      let read = Math.max(5, Math.min(100, Math.round(100 - finalName.length * 5)));
      let liq = Math.max(1, Math.min(99, Math.round(read*0.75 + 25 - rarity.penalty)));
      let sale = Math.max(0.001, val * liq / 100);

      try {
          const t0 = performance.now();
          await new Promise(res => {
            const iv = setInterval(() => {
              if (performance.now() - t0 > 600){ clearInterval(iv); res(); } 
              else { displayEl.textContent = '@' + randomName(); playSound('roll'); }
            }, 45);
          });

          currentUsername = finalName;
          displayEl.textContent = '@' + finalName;
          displayEl.style.color = rarity.color;
          displayEl.style.textShadow = `0 0 25px ${rarity.color}`;
          displayEl.classList.add('pop-anim');
          
          rarityTag.textContent = rarity.name;
          rarityTag.style.color = rarity.color;
          rarityTag.style.border = `1px solid ${rarity.color}`;
          rarityTag.classList.add('show');
          
          document.getElementById('readVal').textContent = read + '%';
          document.getElementById('liqVal').textContent = liq + '%';
          document.getElementById('readBar').style.width = read + '%';
          document.getElementById('liqBar').style.width = liq + '%';
          statsEl.classList.add('show');

          animatePrice(sale);
          createParticles(rarity.color);
          playSound('win');
          
          if(rarity.id === 'mythic' || rarity.id === 'crystal' || rarity.id === 'divine' || rarity.id === 'absolute' || rarity.id === 'anon') {
              if(settings.animations && !settings.lowEnd) {
                  document.body.classList.add('shake-screen');
                  setTimeout(()=>document.body.classList.remove('shake-screen'), 500);
              }
              vibrate('heavy');
          } else { vibrate('success'); }

          const newItem = { id: 'local_' + Date.now(), username: finalName, rarity_name: rarity.name, rarity_color: rarity.color, price: sale };
          
          gameData.inventory.push(newItem);
          gameData.total++;
          saveLocalData();
          updateUI();

          if (supabaseClient && myId) {
              (async () => {
                  try {
                      await supabaseClient.from('usernames').insert([{ 
                          user_id: myId, username: finalName, rarity_name: rarity.name, rarity_color: rarity.color, price: sale 
                      }]);
                      await supabaseClient.from('users').update({ total_generated: gameData.total }).eq('id', myId);
                  } catch(e) { console.log("Фоновое сохранение не удалось"); }
              })();
          }
      } catch(e) { console.error(e); } finally { genBtn.disabled = false; }
    }

    // 9. Коллекция
    let isSelling = false;
    async function openCollection() {
        openModal('collectionModal');
        const list = document.getElementById('invList');
        list.innerHTML = '<div style="text-align:center; padding:20px; color:var(--muted); font-weight:800;">Загрузка...</div>';
        let data = [...gameData.inventory];

        if (supabaseClient && myId) {
            try {
                const res = await supabaseClient.from('usernames').select('*').eq('user_id', myId).order('price', {ascending: false});
                if (res.data) {
                    res.data.forEach(dbItem => {
                        if (!data.find(localItem => localItem.username === dbItem.username)) data.push(dbItem);
                    });
                }
            } catch(e) {}
        }
        
        if(data.length === 0) { list.innerHTML = '<div style="text-align:center;color:var(--muted);padding:20px; font-weight:800;">Пусто</div>'; return; }
        data.sort((a, b) => b.price - a.price);

        list.innerHTML = data.map((item, index) => {
            const price = parseFloat(item.price) || 0;
            return `
            <div class="mc-item" style="border-left-color:${item.rarity_color};">
                <div style="flex:1;">
                    <div class="mc-name" style="color:${item.rarity_color}">@${item.username}</div>
                    <div style="font-size:11px; color:var(--muted); margin-top:4px; font-weight:800;">${item.rarity_name}</div>
                </div>
                <div style="font-size:15px; font-weight:900; color:var(--gold); margin-right:12px;">${price.toFixed(2)} T</div>
                <button class="mc-sell" onclick="sellItem('${item.id}', ${price})">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"></rect><circle cx="12" cy="12" r="2"></circle><path d="M6 12h.01M18 12h.01"></path></svg>
                </button>
            </div>`;
        }).join('');
    }

    async function sellItem(id, price) {
        if (isSelling) return; isSelling = true; vibrate('light');
        try {
            if (id.toString().startsWith('local_')) {
                gameData.inventory = gameData.inventory.filter(i => i.id !== id);
            } else if (supabaseClient && myId) { await supabaseClient.from('usernames').delete().eq('id', id); }
            
            gameData.balance += parseFloat(price);
            saveLocalData();
            updateUI();
            
            showToast(`Продано за +${price.toFixed(2)} TON`, '#3ddc84');
            
            if (supabaseClient && myId) {
                (async () => {
                    try { await supabaseClient.from('users').update({ balance: gameData.balance }).eq('id', myId); } catch(e){}
                })();
            }
            openCollection();
        } catch(e) { showToast('Ошибка продажи', '#ff3b6b'); } finally { isSelling = false; }
    }

    async function sellAll() {
        if (isSelling) return; isSelling = true; vibrate('medium');
        const btn = document.getElementById('sellAllBtn'); btn.disabled = true; btn.textContent = 'ПРОДАЖА...';
        let tot = 0;
        try {
            if (supabaseClient && myId) {
                const { data } = await supabaseClient.from('usernames').select('*').eq('user_id', myId);
                if(data && data.length > 0) {
                    tot = data.reduce((s,i)=>s+parseFloat(i.price),0);
                    await supabaseClient.from('usernames').delete().eq('user_id', myId);
                }
            }
            if(gameData.inventory.length > 0) {
                tot += gameData.inventory.reduce((s,i)=>s+parseFloat(i.price),0);
                gameData.inventory = [];
            }
            
            if(tot > 0) { 
                gameData.balance += tot;
                saveLocalData();
                updateUI();
                showToast(`Всё продано! +${tot.toFixed(2)} TON`, '#3ddc84'); 
                
                if (supabaseClient && myId) {
                    (async () => {
                        try { await supabaseClient.from('users').update({ balance: gameData.balance }).eq('id', myId); } catch(e){}
                    })();
                }
            }
            closeModal('collectionModal');
        } catch(e) { showToast('Ошибка', '#ff3b6b'); } finally {
            isSelling = false; btn.disabled = false; btn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"></rect><circle cx="12" cy="12" r="2"></circle><path d="M6 12h.01M18 12h.01"></path></svg> ПРОДАТЬ ВСЁ';
        }
    }

    // 10. Топы
    async function loadLeaderboard() {
        const list = document.getElementById('leaderboardList');
        list.innerHTML = '<div style="text-align:center; padding:20px; color:var(--muted); font-weight:800;">Загрузка топов...</div>';
        if (!supabaseClient) { list.innerHTML = '<div style="text-align:center; padding:20px; color:#ff3b6b; font-weight:800;">Нет связи с сервером</div>'; return; }
        try {
            const res = await supabaseClient.from('users').select('*').order('balance', {ascending: false}).limit(50);
            if (res.error) throw res.error;
            const data = res.data || [];
            if (data.length === 0) { list.innerHTML = '<div style="text-align:center; padding:20px; color:var(--muted); font-weight:800;">Тут пока пусто</div>'; return; }
            list.innerHTML = data.map((u, i) => {
                const initial = u.first_name ? u.first_name[0].toUpperCase() : '?';
                const avatarStyle = u.photo_url ? `background-image:url(${u.photo_url})` : `background:linear-gradient(135deg,#2aabee,#b06dff)`;
                return `
                <div class="lb-item">
                    <div class="lb-rank ${i===0?'top1':i===1?'top2':i===2?'top3':''}">${i+1}</div>
                    <div class="lb-avatar" style="${avatarStyle}">${!u.photo_url ? initial : ''}</div>
                    <div class="lb-name">${u.first_name}</div>
                    <div class="lb-bal">${parseFloat(u.balance || 0).toFixed(1)} TON</div>
                </div>`;
            }).join('');
        } catch(e) { list.innerHTML = '<div style="text-align:center; padding:20px; color:#ff3b6b; font-weight:800;">Ошибка загрузки</div>'; }
    }

    // 11. Каталог
    function renderCatalog() {
        document.getElementById('catalogBody').innerHTML = RARITIES.map(r => `
            <div class="cat-item" style="border-left-color:${r.color}">
                <div style="font-weight:900; color:${r.color}">${r.name}</div>
                <div style="font-family:monospace; font-weight:900; color:var(--gold)">от ${r.base} TON</div>
            </div>`).join('');
    }
    renderCatalog();

    // 12. Колесо
    const WHEEL_PRIZES = [
      { label: 'ПУСТО', type: 'none', value: 0, color: '#222' },
      { label: '10 TON', type: 'ton', value: 10, color: '#3b9eff' },
      { label: 'ПУСТО', type: 'none', value: 0, color: '#222' },
      { label: '50 TON', type: 'ton', value: 50, color: '#b06dff' },
      { label: 'ПУСТО', type: 'none', value: 0, color: '#222' },
      { label: 'x2', type: 'mult', value: 2, color: '#ff3b6b' },
      { label: 'ПУСТО', type: 'none', value: 0, color: '#222' },
      { label: '100 TON', type: 'ton', value: 100, color: '#ffb020' },
    ];
    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');
    let currentRotation = 0;
    let isSpinning = false;

    function drawWheel() {
      const numSlices = WHEEL_PRIZES.length;
      const sliceAngle = (2 * Math.PI) / numSlices;
      const cx = canvas.width / 2; const cy = canvas.height / 2;
      const radius = canvas.width / 2 - 10;

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = 0; i < numSlices; i++) {
        const startAngle = i * sliceAngle; const endAngle = startAngle + sliceAngle;
        ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, radius, startAngle, endAngle);
        ctx.fillStyle = WHEEL_PRIZES[i].color; ctx.fill();
        ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 3; ctx.stroke();

        ctx.save(); ctx.translate(cx, cy); ctx.rotate(startAngle + sliceAngle / 2);
        ctx.textAlign = "right"; ctx.fillStyle = "#fff"; ctx.font = "900 28px 'Manrope', sans-serif";
        ctx.shadowColor = "rgba(0,0,0,0.8)"; ctx.shadowBlur = 8;
        ctx.fillText(WHEEL_PRIZES[i].label, radius - 20, 10); ctx.restore();
      }
      ctx.beginPath(); ctx.arc(cx, cy, 40, 0, Math.PI * 2);
      ctx.fillStyle = '#0f151e'; ctx.fill(); ctx.strokeStyle = '#2aabee'; ctx.lineWidth = 5; ctx.stroke();
    }

    function openWheel() { openModal('wheelModal'); setTimeout(() => { drawWheel(); }, 100); }

    document.getElementById('spinBtn').addEventListener('click', () => {
        if (isSpinning) return; isSpinning = true; vibrate('medium');
        const btn = document.getElementById('spinBtn'); btn.disabled = true; btn.textContent = 'КРУТИТСЯ...';

        let tickCount = 0;
        const tickInterval = setInterval(() => {
            playSound('roll'); tickCount++; if (tickCount > 30) clearInterval(tickInterval);
        }, 100);

        const spins = 5 + Math.floor(Math.random() * 5);
        const randomDeg = Math.floor(Math.random() * 360);
        currentRotation += (spins * 360) + randomDeg;
        canvas.style.transform = `rotate(${currentRotation}deg)`;

        setTimeout(async () => {
            clearInterval(tickInterval); isSpinning = false;
            btn.disabled = false; btn.textContent = 'КРУТИТЬ';

            const normalized = currentRotation % 360;
            const sliceAngle = 360 / WHEEL_PRIZES.length;
            let index = Math.floor((360 - normalized + 270) % 360 / sliceAngle);
            if (index < 0) index += WHEEL_PRIZES.length;
            const prize = WHEEL_PRIZES[index];

            if (prize.type === 'ton') {
                gameData.balance += prize.value;
                saveLocalData(); updateUI();
                showToast(`Выигрыш: ${prize.value} TON!`, '#ffcf4d');
                playSound('win'); vibrate('success');
                if (supabaseClient && myId) {
                    (async () => {
                        try { await supabaseClient.from('users').update({ balance: gameData.balance }).eq('id', myId); } catch(e){}
                    })();
                }
            } else if (prize.type === 'mult') {
                showToast(`Выигрыш: x2 Множитель!`, '#ff3b6b');
                playSound('win'); vibrate('success');
            } else {
                showToast('ПУСТО... В следующий раз повезет!', '#8b9bad'); vibrate('error');
            }
        }, 4100);
    });

    genBtn.addEventListener('click', generate);
    syncUser();
</script>
</body>
</html>
